[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attck-pipeline"
version = "0.1.0"
description = "ATT&CK Knowledge Pipeline for Liszt — release-pinned identity, drift detection, and reproducible reporting on MongoDB"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.7,<5",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "loguru>=0.7,<1",
    "typer>=0.12,<1",
    "rfc8785>=0.1.4,<1",
    "jinja2>=3.1,<4",
    "boto3>=1.34,<2",
    "weasyprint>=70.0,<71",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "testcontainers[mongodb]>=4.0",
    "freezegun>=1.4",
    "coverage>=7.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
liszt = "attck_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/attck_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
